name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # to publish the release on a tag
    steps:
      - uses: actions/checkout@v5

      # glslc and the Vulkan headers compile whisper.cpp's GPU shaders; they
      # are build-time only. libclang-dev is what bindgen needs to generate the
      # Vulkan bindings -- without it whisper-rs-sys falls back to prebuilt
      # bindings that lack them, and the build fails much later and much less
      # clearly.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake libclang-dev glslc libvulkan-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo install cargo-deb --locked
          cargo deb --output target/debian/
          ls -l target/debian/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/debian/*.deb --generate-notes
